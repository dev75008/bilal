name: Publier Atelier Footage sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Contrôle quotidien du site publié : détecte un domaine ou un hébergement inopérant.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les fonctions et le parcours React
        run: npm test
      - name: Compiler et chiffrer l’application pour GitHub Pages
        run: npm run build:pages
        env:
          PAGES_ACCESS_PASSWORD: ${{ secrets.PAGES_ACCESS_PASSWORD }}
      - name: Vérifier le paquet chiffré et le démarrage de React
        run: node --experimental-vm-modules scripts/verify-encrypted-pages.mjs
        env:
          PAGES_ACCESS_PASSWORD: ${{ secrets.PAGES_ACCESS_PASSWORD }}
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verifier:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Vérifier le site réellement publié
        run: node scripts/check-deployment.mjs "${{ needs.deploy.outputs.page_url }}"

  surveillance:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Vérifier l’adresse de production
        run: node scripts/check-deployment.mjs "${{ vars.PRODUCTION_URL || 'https://dev75008.github.io/bilal/' }}"
